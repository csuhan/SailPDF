appId: com.pdfpro.app
productName: Sail PDF
afterSign: scripts/verify-macos-package.cjs
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - public/cmaps/**
  - public/standard_fonts/**
  - package.json
  - LICENSE
  - NOTICE
  - locales/**/*
  - '!dist/samples/**/*'
  - '!**/@napi-rs'
  - '!**/*.d.ts'
extraResources:
  - from: native/pdfpro-ocr
    to: pdfpro-ocr
  # llama.cpp llama-server + its dylibs (fetched by scripts/fetch-llama.mjs);
  # model weights are downloaded by the app on first use
  - from: vendor/llama
    to: llama
    filter:
      - '**/*'
mac:
  artifactName: Sail-PDF-${version}-macOS-${arch}.${ext}
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dir
    - dmg
  # Seal the complete bundle for beta builds; this is not Developer ID signing.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extendInfo:
    CFBundleDisplayName: Sail PDF
dmg:
  title: Sail PDF
  background: build/installer-background.png
  iconSize: 80
  window:
    width: 720
    height: 560
  contents:
    - x: 190
      y: 190
      type: file
    - x: 530
      y: 190
      type: link
      path: /Applications
    - x: 590
      y: 430
      type: file
      path: build/INSTALL.txt
fileAssociations:
  - ext: pdf
    name: PDF Document
    role: Editor
