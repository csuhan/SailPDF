name: Bug report
description: Report a reproducible problem using a synthetic or redacted sample.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Issues are public. Do not include private PDFs, personal information, local profiles or API keys. For security issues, use private vulnerability reporting.'
  - type: input
    id: version
    attributes: { label: Sail PDF version, placeholder: 'For example: 0.11.0' }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: System and device, placeholder: 'macOS version, Apple Silicon model, memory' }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      { label: Steps to reproduce, description: 'Start from opening the application and describe each action.' }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: Expected and actual result }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes: { label: Optional diagnostics, description: 'Review app-exported diagnostics before sharing them.' }
